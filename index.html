<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Valentine's Day ❤️</title>

<style>

body {
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    font-family: Arial, sans-serif;
    text-align: center;
    color: white;
    padding: 30px;
    overflow-x: hidden;
}

.box {
    background: rgba(0,0,0,0.35);
    padding: 25px;
    border-radius: 15px;
    display: inline-block;
    max-width: 400px;
}

button {
    padding: 12px 20px;
    margin: 10px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    background: white;
    color: #ff4d6d;
    font-weight: bold;
}

button:hover {
    background: #ffe0e6;
}

.hidden {
    display: none;
    margin-top: 20px;
    font-size: 18px;
}

#result {
    margin-top: 15px;
    font-weight: bold;
}

.heart {
    position: fixed;
    top: -10px;
    font-size: 20px;
    animation: fall linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(100vh);
        opacity: 0;
    }
}

</style>

</head>
<body>

<div class="box">

<h2>Hi Vandanaa ❤️</h2>

<p>Answer these honestly 😌</p>

<div id="q1">
<p>Do you know how special you are to me?</p>
<button onclick="next('q2')">Yes ❤️</button>
<button onclick="next('q2')">Maybe 😌</button>
</div>

<div id="q2" class="hidden">
<p>Did you ever imagine someone would love you this much?</p>
<button onclick="next('q3')">Yes 💕</button>
<button onclick="next('q3')">No 😳</button>
</div>

<div id="q3" class="hidden">
<p>Do you want a kiss? 😌</p>
<button onclick="next('q4')">Yes obviously 😘</button>
<button onclick="next('q4')">Maybe... 👀</button>
</div>

<div id="q4" class="hidden">

<p>Whose kiss do you want?</p>

<button onclick="wrongAnswer()">Sun’s kiss ☀️</button>
<button onclick="correctAnswer()">My kiss 😘</button>

<p id="result"></p>

</div>

<div id="final" class="hidden">

<p id="typedText"></p>

<br>

<a href="https://drive.google.com/uc?export=view&id=1VMFr3F7cfsIWUFxpU2Kvoh76j10T8MAy" target="_blank">
<button>🎬 Click here for your final surprise</button>
</a>

</div>

</div>

<script>

function next(id) {
    hideAll();
    document.getElementById(id).style.display = "block";
}

function hideAll() {
    document.getElementById("q1").style.display="none";
    document.getElementById("q2").style.display="none";
    document.getElementById("q3").style.display="none";
    document.getElementById("q4").style.display="none";
}

function wrongAnswer() {
    document.getElementById("result").innerHTML = "Wrong answer 😏 Try again";
}

function correctAnswer() {
    document.getElementById("result").innerHTML = "Correct choice ❤️";
    
    setTimeout(function() {
        document.getElementById("q4").style.display="none";
        document.getElementById("final").style.display="block";
        typeText();
    }, 1500);
}

var text = "I know I am one day late to send this...\\n\\nBut it doesn’t matter because no matter when — today or tomorrow —\\n\\nI always love you ❤️\\n\\nHappy Valentine’s Day Vandanaa 💖";

var i = 0;

function typeText() {

    if(i < text.length) {

        document.getElementById("typedText").innerHTML += text.charAt(i);

        i++;

        setTimeout(typeText, 40);

    }

}

function createHeart() {

    const heart = document.createElement("div");

    heart.className = "heart";

    heart.innerHTML = "❤️";

    heart.style.left = Math.random() * 100 + "vw";

    heart.style.animationDuration = (Math.random() * 3 + 2) + "s";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 5000);

}

setInterval(createHeart, 300);

</script>

</body>
</html>
